<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>teste de formulário</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="iano">Em que ano você nasceu? </label>
            <input type="number" name="ano" id="iano" min="1900" max="2026" value="2000" oninput="calcIdade()">


        </p>
        <p>
            <label for="iidade">Sua idade</label>
            <output id="iidade">26</output>
        </p>
        <script>
            function calcIdade() {
                let anoatual = new Date().getFullYear()
                iidade.innerHTML = Number(anoatual) - Number(iano.value)
            }
        </script>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
