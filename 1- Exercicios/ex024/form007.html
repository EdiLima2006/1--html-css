<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     body{
        font-family: Arial, Helvetica, sans-serifs;
     }
    </style>
</head>
<body>
    <h1>formulário sem input</h1>
    
    <form action="cadastro.php" method="get">
        <p>
            <label for="iestado">Estado</label>
            <select name="estado" id="iestado">

                <option value="escolha" selected>--- Escolha --- </option>
                <optgroup label="Região Sudeste">
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio De Janeiro</option>
                    <option value="SP">São Paulo</option>
                </optgroup>
                
                <optgroup label="Nordeste">
                    <option value="BA">Bahia</option>
                    <option value="MA">Maranhão</option>
                    <option value="PE">Pernambuco</option>
                </optgroup>
            </select>
        </p>

        <p>
            <label for="iprof">Profissão</label>
            <input type="text" name="Prof" id="iprof" list="lstprof" placeholder="Escolha sua profissão">
            <datalist id="lstprof">
                <option value="ADM">Administrador</option>
                <option value="DEV">Desenvolvedor</option>
                <option>Professor</option>
                <option>Contabilista</option>
            </datalist>
        </p>
        <p>
            <label for="icom">Comentario</label><br>           
            <textarea name="com" id="icom" cols="30" rows="10"></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
