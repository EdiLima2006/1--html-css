<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="ivalor">Valor</label>
            <input type="range" name="valor" id="ivalor" min="0" max="15" value="5" oninput="ival.innerHTML = Number(ivalor.value)">
            <output id="ival">5</output>
        </p>
    </form>
</body>
</html>
