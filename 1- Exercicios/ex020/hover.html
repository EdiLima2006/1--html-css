<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover</title>
    <link rel="stylesheet" href="style.css">
    <style>
        div > p{
            display: none; /*Não mostre nada(Esconder)*/
        }
        div:hover > p{
            display: block;
            font-family: 'Times New Roman', Times, serif;
            color: white;
            background-color: rgb(216, 56, 56);
            width: 160px;
        }
        div:hover{
            color: rgb(216, 56, 56);
        }

    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>passe o mouse sobre o texto abaixo</p>
    <div>
        passe o mouse aqui
        <p>Texto escondido...</p>
    </div>
    <p>fim do exemplo</p>
    <a href="menu principal.html" style="color: rgb(216, 56, 56);">voltar para o menu</a>
</body>
</html>
